name: Weekly refresh

# In-season: pull the latest results/fixtures, update ratings and predictions, and commit the
# new tips feed. GitHub cron runs in UTC and can be delayed, so each run is idempotent and the
# Thursday run lands many hours before the usual first bounce.
#   Tue 22:00 UTC (Wed ~08:00 AEST): after the round, update results, ratings, next round's tips
#   Thu 02:00 UTC (Thu ~12:00 AEST): team selections are out; refresh the tips before lockout
# Outside Mar-Sep it exits early (off-season) unless started by hand.

on:
  schedule:
    - cron: "0 22 * * 2"
    - cron: "0 2 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the season window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FOOTY_CONTACT_EMAIL: ${{ secrets.FOOTY_CONTACT_EMAIL }}
    steps:
      - name: In season?
        id: season
        run: |
          m=$(date -u +%-m)
          if [ "${{ inputs.force }}" = "true" ] || { [ "$m" -ge 3 ] && [ "$m" -le 9 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season (month $m): nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.season.outputs.run == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.season.outputs.run == 'true'
        with:
          r-version: "4.5.0"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        if: steps.season.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.season.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python
        if: steps.season.outputs.run == 'true'
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Incremental extract (current season only)
        if: steps.season.outputs.run == 'true'
        run: Rscript R/extract_data.R --incremental

      - name: Rebuild tables and features
        if: steps.season.outputs.run == 'true'
        run: |
          python -m footyforecast.io
          python -m footyforecast.features

      - name: Refit ML walk-forward, re-score and predict the next round
        if: steps.season.outputs.run == 'true'
        run: |
          python -m footyforecast.model_match
          python -m footyforecast.evaluation.backtest
          python -m footyforecast.predict

      - name: Tests
        if: steps.season.outputs.run == 'true'
        run: pytest

      - name: Commit updated data and tips
        if: steps.season.outputs.run == 'true'
        run: |
          git config user.name "footyforecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/processed results predictions
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly refresh: $(date -u +%F)"
            git push
          fi
